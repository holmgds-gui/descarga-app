# Publica o Descarga no GitHub Pages a cada push na main
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # chaves públicas do Supabase (podem ficar no código; quem protege os dados são as regras do banco)
          VITE_SUPABASE_URL: https://ebumtgqfiygrfaafjctg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_hWAC4jOOMMHNkwvWoIpsig_YDaS2Uuh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
